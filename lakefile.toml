name = "upg-lean"
version = "1.0.0"
defaultTargets = ["UPGFeedback"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

# Every module keeps its original name and bytes (see PROVENANCE.md).
[[lean_lib]]
name = "UPGFeedback"
roots = ["UPGFeedback", "UPGBlockFeedback", "UPGProjectorMetric", "UPGProjectorDynamics",
  "UPGResolventFeedback", "UPGPositiveFeedback", "UPGInterfacePersistence", "UPGInterfaceSpectrum"]
