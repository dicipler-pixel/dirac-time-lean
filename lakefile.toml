name = "dirac-time-lean"
version = "0.1.0"
defaultTargets = ["DiracTime"]

# Physlib supplies the quantum-information library (von Neumann entropy of mixed states).
[[require]]
name = "Physlib"
git = "https://github.com/leanprover-community/physlib"
rev = "35d1bb4313be7127a39cd6cf29f02b758b9461b9"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

# Every result proved for the paper "The Dirac Time of the Gigantefermion".
# DiracTime.lean imports every module so that `lake build` compiles all of them.
[[lean_lib]]
name = "DiracTime"
